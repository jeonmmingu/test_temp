<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조경산업기사 빈출 4지선다 퀴즈</title>
<style>
:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --line: #d8e2ef;
  --accent: #2563eb;
  --accent-soft: #eaf1ff;
  --ok: #15803d;
  --bad: #b91c1c;
  --warn: #b45309;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; width: 100%; overflow-x: hidden; }
body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.62;
  font-size: 15px;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; }
a { color: inherit; text-decoration: none; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
.top-inner { max-width: 1060px; margin: 0 auto; padding: 14px 18px 12px; }
.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
h1 { margin: 0; font-size: 21px; line-height: 1.25; letter-spacing: 0; word-break: keep-all; }
.links { display: flex; gap: 8px; flex: 0 0 auto; }
.link-btn, .tab, .nav-btn, .answer-btn {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  cursor: pointer;
  font-weight: 800;
}
.link-btn { min-height: 38px; padding: 7px 11px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tab { flex: 0 0 auto; min-height: 38px; padding: 7px 11px; white-space: nowrap; }
.tab.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 18px; }
.quiz-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  background: #fbfdff;
}
.pill {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: #1d4ed8;
  font-size: 13px;
  font-weight: 900;
}
.pill.warn { background: #fff7ed; color: var(--warn); }
.body { padding: 20px 18px 18px; }
.progress { margin: 0 0 8px; color: var(--muted); font-weight: 800; }
.stem { margin: 0 0 16px; font-size: 20px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
.concept {
  margin: 0 0 16px;
  padding: 12px 13px;
  border: 1px solid #bfd4f5;
  border-radius: 8px;
  background: #f7fbff;
  color: #334155;
  overflow-wrap: anywhere;
}
.quiz-mascot {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: -4px 0 16px;
  padding: 10px 12px;
  border: 1px solid #bbf7d0;
  border-radius: 8px;
  background: #f0fdf4;
}
.quiz-mascot img, .modal-mascot-img {
  flex: 0 0 auto;
  width: 48px;
  height: 48px;
  object-fit: contain;
  filter: drop-shadow(0 8px 10px rgba(15, 23, 42, 0.14));
}
.quiz-mascot p {
  margin: 0;
  color: #166534;
  font-weight: 900;
  line-height: 1.45;
  word-break: keep-all;
}
.answers { display: grid; gap: 10px; }
.answer-btn {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  min-height: 54px;
  padding: 12px;
  text-align: left;
}
.answer-btn span:last-child {
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: keep-all;
}
.answer-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.box {
  width: 22px;
  height: 22px;
  border: 2px solid #9fb3cc;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  margin-top: 1px;
}
.answer-btn.selected .box { border-color: var(--accent); background: var(--accent); }
.answer-btn.correct { border-color: #86efac; background: #f0fdf4; }
.answer-btn.wrong { border-color: #fecaca; background: #fff1f2; }
.footer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.nav-btn { min-height: 44px; padding: 8px 12px; }
.nav-btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
.note { margin: 12px 4px 0; color: var(--muted); font-size: 13px; font-weight: 700; }
.source-list {
  margin-top: 16px;
  color: var(--muted);
  font-size: 13px;
}
.source-list strong { color: var(--text); }
.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(15, 23, 42, 0.48);
  z-index: 50;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: min(560px, 100%);
  max-height: 82vh;
  overflow-y: auto;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
}
.modal-head {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 18px 18px 8px;
}
.modal-mascot-img {
  width: 58px;
  height: 58px;
}
.result-mark { margin: 0 0 6px; font-size: 30px; font-weight: 900; }
.result-mark.ok { color: var(--ok); }
.result-mark.bad { color: var(--bad); }
.modal h2 { margin: 0; font-size: 21px; line-height: 1.35; }
.modal-body { padding: 8px 18px 18px; }
.modal-body p { margin: 0 0 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; }
@media (max-width: 720px) {
  body { font-size: 14px; }
  .top-inner { padding: 14px 12px 12px; }
  .title-row { display: block; }
  h1 { font-size: 19px; margin-bottom: 10px; }
  .links { display: grid; grid-template-columns: 1fr; }
  .link-btn { text-align: center; }
  .wrap { padding: 14px 10px 34px; }
  .body { padding: 16px 14px; }
  .stem { font-size: 18px; word-break: break-all; }
  .concept, .answer-btn span:last-child, .source-list { word-break: break-all; }
  .quiz-mascot { align-items: flex-start; }
  .footer { grid-template-columns: 1fr; }
}
</style>
</head>

<header class="topbar">
  <div class="top-inner">
    <div class="title-row">
      <h1>조경산업기사 빈출 4지선다 퀴즈</h1>
      <div class="links">
        <a class="link-btn" href="./index.html">초기 화면</a>
      </div>
    </div>
    <nav class="tabs" data-tabs aria-label="카테고리 선택"></nav>
  </div>
</header>

<main class="wrap">
  <section class="quiz-card">

      <h2 class="stem" data-stem></h2>
      <p class="concept" data-concept></p>
      <div class="quiz-mascot" aria-label="또로 풀이 힌트">

      </div>

      <p class="note">문제는 실제 기출에서 가져온 대표 문항입니다. 횟수는 같은 핵심어가 기출 문제 또는 정답에 등장한 관련 기출 횟수이며, 많이 나온 개념일수록 랜덤 출제에서 더 자주 나옵니다.</p>
    </div>
  </section>
</main>

<div class="modal-backdrop" data-modal>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <img class="modal-mascot-img" src="./assets/ddoro-cutout.png" alt="" aria-hidden="true">
      <div>
        <p class="result-mark" data-modal-mark></p>
        <h2 id="modal-title" data-modal-title></h2>
      </div>
    </div>
    <div class="modal-body" data-modal-text></div>
    <div class="modal-actions">
      <button class="nav-btn" type="button" data-modal-close>닫기</button>
      <button class="nav-btn primary" type="button" data-modal-next>랜덤 다음 문제</button>
    </div>
  </section>
</div>

const nextBtn = document.querySelector("[data-next]");
const randomBtn = document.querySelector("[data-random]");
const modalBackdrop = document.querySelector("[data-modal]");
const modalMark = document.querySelector("[data-modal-mark]");
const modalTitle = document.querySelector("[data-modal-title]");
const modalText = document.querySelector("[data-modal-text]");
const modalClose = document.querySelector("[data-modal-close]");
const modalNext = document.querySelector("[data-modal-next]");

function pool() {
  return quizItems.filter(item => currentCategory === "전체" || item.subject === currentCategory);
}

function weightedRandomIndex(items) {
  const total = items.reduce((sum, item) => sum + item.count, 0);
  let pick = Math.random() * total;
  for (let i = 0; i < items.length; i += 1) {
    pick -= items[i].count;
    if (pick <= 0) return i;
  }
  return Math.max(0, items.length - 1);
}

function renderTabs() {
  tabs.innerHTML = "";
  categories.forEach(category => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab" + (category === currentCategory ? " active" : "");
    const count = category === "전체" ? quizItems.length : quizItems.filter(item => item.subject === category).length;
    btn.textContent = `${category} ${count}`;
    btn.addEventListener("click", () => {
      currentCategory = category;
      currentIndex = 0;
      answered = false;
      render();
    });
    tabs.appendChild(btn);
  });
}

function render() {
  renderTabs();
  const items = pool();
  if (!items.length) return;
  currentIndex = Math.max(0, Math.min(currentIndex, items.length - 1));
  const item = items[currentIndex];
  answered = false;

  meta.innerHTML = `
    <span class="pill">${item.subject}</span>
    <span class="pill warn">관련 기출 ${item.count}회</span>
    <span class="pill">${item.term}</span>
    <span class="pill">${item.exam} ${item.num}번</span>
  `;
  progress.textContent = `${currentIndex + 1} / ${items.length}`;
  stem.textContent = item.stem;
  concept.innerHTML = `<strong>${item.term}</strong>: ${item.concept || "반복 출제된 핵심어입니다."}`;
  sources.innerHTML = `<strong>반복 확인:</strong> ${item.occurrences.join(", ")}`;

  answers.innerHTML = "";
  item.options.forEach((option, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "answer-btn";
    btn.innerHTML = `<span class="box"></span><span>${"①②③④"[idx]} ${option}</span>`;
    btn.addEventListener("click", () => choose(idx + 1));
    answers.appendChild(btn);
  });
}

function choose(choice) {
  if (answered) return;
  answered = true;
  const item = pool()[currentIndex];
  const correct = choice === item.answer;
  const buttons = [...answers.querySelectorAll(".answer-btn")];
  buttons.forEach((btn, idx) => {
    if (idx + 1 === choice) btn.classList.add("selected", correct ? "correct" : "wrong");
    if (idx + 1 === item.answer) btn.classList.add("correct");
    btn.querySelector(".box").textContent = idx + 1 === choice ? "✓" : "";
  });

  modalMark.textContent = correct ? "O" : "X";
  modalMark.className = "result-mark " + (correct ? "ok" : "bad");
  modalTitle.textContent = correct ? "또로: 맞았습니다" : "또로: 다시 보면 잡히는 함정입니다";
  modalNext.hidden = !correct;
  const chosenText = item.options[choice - 1];
  const answerText = item.options[item.answer - 1];
  if (correct) {
    modalText.innerHTML = `
      <p><strong>맞은 이유:</strong> ${item.correctReason}</p>
      <p>이 문제는 <strong>${item.term}</strong> 계열의 핵심어가 관련 기출에서 ${item.count}회 반복된 빈출 유형입니다.</p>
    `;
  } else {
    modalText.innerHTML = `
      <p><strong>내가 고른 보기:</strong> ${"①②③④"[choice - 1]} ${chosenText}</p>
      <p><strong>왜 틀렸나:</strong> ${item.reasons[choice - 1]}</p>
      <p><strong>정답:</strong> ${"①②③④"[item.answer - 1]} ${answerText}</p>
      <p><strong>정답 이유:</strong> ${item.correctReason}</p>
    `;
  }
  modalBackdrop.classList.add("open");
}

function resetChoice() {
  answered = false;
  const buttons = [...answers.querySelectorAll(".answer-btn")];
  buttons.forEach(btn => {
    btn.classList.remove("selected", "correct", "wrong");
    const box = btn.querySelector(".box");
    if (box) box.textContent = "";
  });
}

function closeModal(reset = true) {
  modalBackdrop.classList.remove("open");
  if (reset) resetChoice();
}

function move(delta) {
  const items = pool();
  currentIndex = (currentIndex + delta + items.length) % items.length;
  render();
}

function randomQuestion() {
  const items = pool();
  currentIndex = weightedRandomIndex(items);
  render();
}

prevBtn.addEventListener("click", () => move(-1));
nextBtn.addEventListener("click", () => move(1));
randomBtn.addEventListener("click", randomQuestion);
modalClose.addEventListener("click", () => closeModal());
modalNext.addEventListener("click", () => {
  closeModal(false);
  randomQuestion();
});
modalBackdrop.addEventListener("click", event => {
  if (event.target === modalBackdrop) closeModal();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && modalBackdrop.classList.contains("open")) closeModal();
});
render();
</script>
</body>
</html>
