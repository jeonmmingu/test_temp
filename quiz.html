<html lang="ko">

<style>
:root {

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; width: 100%; overflow-x: hidden; }
body {

}
button { font: inherit; }
a { color: inherit; text-decoration: none; }
.topbar {
  position: sticky;
  top: 0;

  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid var(--line);

}
.top-inner { max-width: 1060px; margin: 0 auto; padding: 14px 18px 12px; }
.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
h1 { margin: 0; font-size: 21px; line-height: 1.25; letter-spacing: 0; word-break: keep-all; }
.links { display: flex; gap: 8px; flex: 0 0 auto; }
.link-btn, .tab, .nav-btn, .answer-btn {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  cursor: pointer;
  font-weight: 800;
}
.link-btn { min-height: 38px; padding: 7px 11px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }

  min-height: 54px;
  padding: 12px;
  text-align: left;
}
.answer-btn span:last-child {

  word-break: keep-all;
}

  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  margin-top: 1px;

.answer-btn.wrong { border-color: #fecaca; background: #fff1f2; }
.footer {

  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.nav-btn { min-height: 44px; padding: 8px 12px; }
.nav-btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }

.source-list {
  margin-top: 16px;
  color: var(--muted);
  font-size: 13px;
}
.source-list strong { color: var(--text); }
.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(15, 23, 42, 0.48);
  z-index: 50;

.modal {
  width: min(560px, 100%);
  max-height: 82vh;
  overflow-y: auto;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--line);

.result-mark.ok { color: var(--ok); }
.result-mark.bad { color: var(--bad); }
.modal h2 { margin: 0; font-size: 21px; line-height: 1.35; }
.modal-body { padding: 8px 18px 18px; }

.modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; }

  .wrap { padding: 14px 10px 34px; }

  .footer { grid-template-columns: 1fr; }
}
</style>

const concept = document.querySelector("[data-concept]");
const answers = document.querySelector("[data-answers]");
const sources = document.querySelector("[data-sources]");
const prevBtn = document.querySelector("[data-prev]");
const nextBtn = document.querySelector("[data-next]");
const randomBtn = document.querySelector("[data-random]");
const modalBackdrop = document.querySelector("[data-modal]");
const modalMark = document.querySelector("[data-modal-mark]");
const modalTitle = document.querySelector("[data-modal-title]");
const modalText = document.querySelector("[data-modal-text]");
const modalClose = document.querySelector("[data-modal-close]");
const modalNext = document.querySelector("[data-modal-next]");

function pool() {
  return quizItems.filter(item => currentCategory === "전체" || item.subject === currentCategory);
}

function weightedRandomIndex(items) {
  const total = items.reduce((sum, item) => sum + item.count, 0);
  let pick = Math.random() * total;
  for (let i = 0; i < items.length; i += 1) {
    pick -= items[i].count;
    if (pick <= 0) return i;
  }
  return Math.max(0, items.length - 1);
}

function renderTabs() {
  tabs.innerHTML = "";
  categories.forEach(category => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab" + (category === currentCategory ? " active" : "");
    const count = category === "전체" ? quizItems.length : quizItems.filter(item => item.subject === category).length;
    btn.textContent = `${category} ${count}`;
    btn.addEventListener("click", () => {
      currentCategory = category;
      currentIndex = 0;
      answered = false;
      render();
    });
    tabs.appendChild(btn);
  });
}

function render() {
  renderTabs();
  const items = pool();
  if (!items.length) return;
  currentIndex = Math.max(0, Math.min(currentIndex, items.length - 1));
  const item = items[currentIndex];
  answered = false;

  meta.innerHTML = `
    <span class="pill">${item.subject}</span>
    <span class="pill warn">유사 출제 ${item.count}회</span>
    <span class="pill">${item.term}</span>
    <span class="pill">${item.exam} ${item.num}번</span>
  `;
  progress.textContent = `${currentIndex + 1} / ${items.length}`;
  stem.textContent = item.stem;
  concept.innerHTML = `<strong>${item.term}</strong>: ${item.concept || "반복 출제된 핵심어입니다."}`;
  sources.innerHTML = `<strong>반복 확인:</strong> ${item.occurrences.join(", ")}`;

  answers.innerHTML = "";
  item.options.forEach((option, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "answer-btn";
    btn.innerHTML = `<span class="box"></span><span>${"①②③④"[idx]} ${option}</span>`;
    btn.addEventListener("click", () => choose(idx + 1));
    answers.appendChild(btn);
  });
}

function choose(choice) {
  if (answered) return;
  answered = true;
  const item = pool()[currentIndex];
  const correct = choice === item.answer;
  const buttons = [...answers.querySelectorAll(".answer-btn")];
  buttons.forEach((btn, idx) => {
    if (idx + 1 === choice) btn.classList.add("selected", correct ? "correct" : "wrong");
    if (idx + 1 === item.answer) btn.classList.add("correct");
    btn.querySelector(".box").textContent = idx + 1 === choice ? "✓" : "";
  });

  modalMark.textContent = correct ? "O" : "X";
  modalMark.className = "result-mark " + (correct ? "ok" : "bad");
  modalTitle.textContent = correct ? "맞았습니다" : "다시 보면 잡히는 함정입니다";
  const chosenText = item.options[choice - 1];
  const answerText = item.options[item.answer - 1];
  if (correct) {
    modalText.innerHTML = `
      <p><strong>맞은 이유:</strong> ${item.correctReason}</p>
      <p>이 문제는 <strong>${item.term}</strong> 계열이 유사 기출에서 ${item.count}회 반복된 빈출 유형입니다.</p>
    `;
  } else {
    modalText.innerHTML = `
      <p><strong>내가 고른 보기:</strong> ${"①②③④"[choice - 1]} ${chosenText}</p>
      <p><strong>왜 틀렸나:</strong> ${item.reasons[choice - 1]}</p>
      <p><strong>정답:</strong> ${"①②③④"[item.answer - 1]} ${answerText}</p>
      <p><strong>정답 이유:</strong> ${item.correctReason}</p>
    `;
  }
  modalBackdrop.classList.add("open");
}

function move(delta) {
  const items = pool();
  currentIndex = (currentIndex + delta + items.length) % items.length;
  render();
}

function randomQuestion() {
  const items = pool();
  currentIndex = weightedRandomIndex(items);
  render();
}

prevBtn.addEventListener("click", () => move(-1));
nextBtn.addEventListener("click", () => move(1));
randomBtn.addEventListener("click", randomQuestion);
modalClose.addEventListener("click", () => modalBackdrop.classList.remove("open"));
modalNext.addEventListener("click", () => {
  modalBackdrop.classList.remove("open");
  randomQuestion();
});
modalBackdrop.addEventListener("click", event => {
  if (event.target === modalBackdrop) modalBackdrop.classList.remove("open");
});
render();
</script>
</body>
</html>
