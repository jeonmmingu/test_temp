<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조경산업기사 필기 개념 카드</title>
<style>
:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --line: #d8e2ef;
  --accent: #2563eb;
  --accent-soft: #eaf1ff;
  --green: #167447;
  --orange: #b45309;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; width: 100%; overflow-x: hidden; }
body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.62;
  font-size: 15px;
  -webkit-text-size-adjust: 100%;
}
button, select { font: inherit; }
a { color: inherit; text-decoration: none; }
.app { min-height: 100vh; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
.top-inner { max-width: 1120px; margin: 0 auto; padding: 14px 18px 12px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 10px; }
h1 { margin: 0; font-size: 21px; line-height: 1.25; letter-spacing: 0; word-break: keep-all; }
.home-link {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  min-height: 38px;
  padding: 7px 12px;
  font-weight: 800;
}
.subject-tabs, .chapter-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: thin;
  padding-bottom: 2px;
}
.subject-tabs { margin-bottom: 8px; }
.tab {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  min-height: 38px;
  padding: 7px 11px;
  cursor: pointer;
  font-weight: 800;
  white-space: nowrap;
}
.tab.active {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 18px 18px 44px; }
.chapter-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
}
.chapter-title { margin: 0; font-size: 22px; line-height: 1.3; }
.chapter-meta { margin: 3px 0 0; color: var(--muted); font-weight: 700; }
.progress { flex: 0 0 auto; color: var(--muted); font-weight: 800; }
.rail {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  padding: 4px 4px 16px;
  scrollbar-width: thin;
  max-width: 100%;
}
.card {
  flex: 0 0 min(84vw, 390px);
  min-width: 0;
  min-height: 510px;
  scroll-snap-align: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
}
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: #1d4ed8;
  font-size: 13px;
  font-weight: 900;
}
.count { color: var(--muted); font-size: 13px; font-weight: 800; white-space: nowrap; }
.card h3 { margin: 0 0 10px; font-size: 22px; line-height: 1.25; letter-spacing: 0; }
.summary, .block p, .memory p { overflow-wrap: anywhere; word-break: normal; }
.summary { margin: 0 0 14px; color: #334155; font-weight: 700; }
.block {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 12px;
}
.block-title { margin: 0 0 6px; color: var(--muted); font-size: 13px; font-weight: 900; }
.block p { margin: 0; }
.memory {
  margin-top: auto;
  border: 1px solid #f1c58b;
  background: #fff7ed;
  border-radius: 8px;
  padding: 12px;
}
.memory .block-title { color: var(--orange); }
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.nav {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  min-height: 42px;
  cursor: pointer;
  font-weight: 900;
}
.nav.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
.hint {
  margin: 10px 4px 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}
.overview {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.mini {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 12px;
}
.mini strong { display: block; margin-bottom: 4px; }
.mini span { color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  body { font-size: 14px; }
  .top-inner { padding: 18px 12px 12px; }
  .title-row { align-items: flex-start; flex-direction: column; gap: 9px; }
  h1 { font-size: 19px; }
  .home-link { width: 100%; text-align: center; }
  .wrap { padding: 14px 10px 32px; }
  .chapter-head { align-items: flex-start; flex-direction: column; gap: 4px; padding: 0 2px; }
  .chapter-title { font-size: 20px; }
  .progress { font-size: 13px; }
  .rail { gap: 10px; padding-left: 2px; padding-right: 2px; }
  .card { flex: 0 0 min(360px, calc(100vw - 28px)); max-width: min(360px, calc(100vw - 28px)); min-height: 520px; padding: 16px; }
  .card h3 { font-size: 21px; }
  .summary, .block p, .memory p { word-break: break-all; }
  .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-inner">
      <div class="title-row">
        <h1>조경산업기사 필기 개념 카드</h1>
        <a class="home-link" href="./index.html">문항 해설집</a>
      </div>
      <nav class="subject-tabs" data-subject-tabs aria-label="과목 선택"></nav>
      <nav class="chapter-tabs" data-chapter-tabs aria-label="챕터 선택"></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="chapter-head">
      <div>
        <h2 class="chapter-title" data-chapter-title></h2>
        <p class="chapter-meta" data-chapter-meta></p>
      </div>
      <div class="progress" data-progress></div>
    </section>
    <section class="rail" data-rail aria-label="개념 카드"></section>
    <div class="actions">
      <button class="nav" type="button" data-prev>이전 카드</button>
      <button class="nav primary" type="button" data-next>다음 카드</button>
    </div>
    <p class="hint">카드를 좌우로 밀거나 버튼을 눌러 넘기세요. 시험 직전에는 노란 암기칸만 훑어도 꽤 든든합니다.</p>
    <section class="overview" data-overview aria-label="전체 구성"></section>
  </main>
</div>

<script>
const subjects = [

          ["종합적 방제", "예방, 환경 개선, 생물적·물리적·화학적 방제를 함께 쓰는 방법이다.", "무조건 약제만 쓰는 방식이 아니라 피해 수준과 생태를 함께 본다.", "방제는 한 방이 아니라 조합 플레이다."]
        ]
      },
      {
        title: "시설물과 이용 안전",
        cards: [
          ["시설물 점검", "파손, 부식, 흔들림, 미끄럼 위험을 정기적으로 확인한다.", "놀이시설, 데크, 난간, 포장 파손이 안전 문제와 연결된다.", "시설물은 조용히 낡는다. 점검표가 대신 말해준다."],
          ["포장 보수", "침하, 들뜸, 균열, 배수 불량을 찾아 보수한다.", "원인을 고치지 않고 표면만 고치면 같은 하자가 반복된다.", "바닥이 삐끗하면 이용자도 삐끗한다."],
          ["배수로 관리", "낙엽, 토사, 쓰레기를 제거해 물 흐름을 유지한다.", "막힌 배수는 침수, 포장 파손, 식물 생육 불량으로 이어진다.", "물길은 막히기 전 관리하는 게 제일 싸다."],
          ["이용자 안전", "공간을 쓰는 사람의 사고 가능성을 줄이는 관리다.", "시야 확보, 조명, 미끄럼 방지, 안내 체계가 단서다.", "좋은 공간은 예쁜 것보다 먼저 안전해야 오래 사랑받는다."],
          ["유지관리 계획", "점검 주기, 작업 시기, 예산, 인력을 체계적으로 정하는 계획이다.", "계절별 작업과 우선순위 판단 문제가 자주 나온다.", "관리는 즉흥 연주가 아니라 달력 싸움이다."]
        ]
      }
    ]
  }
];

let subjectIndex = 0;
let chapterIndex = 0;
let cardIndex = 0;
const subjectTabs = document.querySelector("[data-subject-tabs]");
const chapterTabs = document.querySelector("[data-chapter-tabs]");
const rail = document.querySelector("[data-rail]");
const chapterTitle = document.querySelector("[data-chapter-title]");
const chapterMeta = document.querySelector("[data-chapter-meta]");
const progress = document.querySelector("[data-progress]");
const overview = document.querySelector("[data-overview]");
const prevBtn = document.querySelector("[data-prev]");
const nextBtn = document.querySelector("[data-next]");

function currentSubject() { return subjects[subjectIndex]; }
function currentChapter() { return currentSubject().chapters[chapterIndex]; }

function renderSubjectTabs() {
  subjectTabs.innerHTML = "";
  subjects.forEach((subject, idx) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (idx === subjectIndex ? " active" : "");
    btn.type = "button";
    btn.textContent = subject.title;
    btn.addEventListener("click", () => {
      subjectIndex = idx;
      chapterIndex = 0;
      cardIndex = 0;
      render();
    });
    subjectTabs.appendChild(btn);
  });
}

function renderChapterTabs() {
  chapterTabs.innerHTML = "";
  currentSubject().chapters.forEach((chapter, idx) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (idx === chapterIndex ? " active" : "");
    btn.type = "button";
    btn.textContent = chapter.title;
    btn.addEventListener("click", () => {
      chapterIndex = idx;
      cardIndex = 0;
      render();
    });
    chapterTabs.appendChild(btn);
  });
}

function cardTemplate(card, idx, total) {
  const [title, summary, point, memory] = card;
  return `
    <article class="card">
      <div class="card-top">
        <span class="badge">${currentSubject().title}</span>
        <span class="count">${idx + 1} / ${total}</span>
      </div>
      <h3>${title}</h3>
      <p class="summary">${summary}</p>
      <div class="block">
        <p class="block-title">시험 포인트</p>
        <p>${point}</p>
      </div>
      <div class="memory">
        <p class="block-title">암기 문장</p>
        <p>${memory}</p>
      </div>
    </article>
  `;
}

function renderCards() {
  const chapter = currentChapter();
  rail.innerHTML = chapter.cards.map((card, idx) => cardTemplate(card, idx, chapter.cards.length)).join("");
  chapterTitle.textContent = chapter.title;
  chapterMeta.textContent = `${currentSubject().title} · ${chapter.cards.length}개 카드`;
  updateProgress();
  requestAnimationFrame(() => scrollToCard("auto"));
}

function updateProgress() {
  const chapter = currentChapter();
  progress.textContent = `${cardIndex + 1} / ${chapter.cards.length}`;
}

function renderOverview() {
  overview.innerHTML = subjects.map(subject => {
    const total = subject.chapters.reduce((sum, chapter) => sum + chapter.cards.length, 0);
    return `<div class="mini"><strong>${subject.title}</strong><span>${subject.chapters.length}개 챕터 · ${total}개 카드</span></div>`;
  }).join("");
}

function move(delta) {
  const chapter = currentChapter();
  cardIndex += delta;
  if (cardIndex < 0) {
    if (chapterIndex > 0) {
      chapterIndex -= 1;
      cardIndex = currentChapter().cards.length - 1;
      render();
      return;
    }
    cardIndex = 0;
  }
  if (cardIndex >= chapter.cards.length) {
    if (chapterIndex < currentSubject().chapters.length - 1) {
      chapterIndex += 1;
      cardIndex = 0;
      render();
      return;
    }
    cardIndex = chapter.cards.length - 1;
  }
  scrollToCard("smooth");
  updateProgress();
}

function scrollToCard(behavior) {
  const card = rail.children[cardIndex];
  if (!card) return;
  rail.scrollTo({
    left: card.offsetLeft - rail.offsetLeft - 2,
    behavior
  });
}

function syncFromScroll() {
  const cards = [...rail.children];
  const center = rail.scrollLeft + rail.clientWidth / 2;
  let best = 0;
  let bestDist = Infinity;
  cards.forEach((card, idx) => {
    const cardCenter = card.offsetLeft + card.offsetWidth / 2;
    const dist = Math.abs(center - cardCenter);
    if (dist < bestDist) {
      best = idx;
      bestDist = dist;
    }
  });
  cardIndex = best;
  updateProgress();
}

let scrollTimer = 0;
rail.addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(syncFromScroll, 80);
});
prevBtn.addEventListener("click", () => move(-1));
nextBtn.addEventListener("click", () => move(1));

function render() {
  renderSubjectTabs();
  renderChapterTabs();
  renderCards();
  renderOverview();
}
render();
</script>
</body>
</html>
