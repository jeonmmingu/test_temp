<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조경산업기사 필기 학습 홈</title>
<style>
:root {
  --bg: #f4f7fb;
  --panel: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --line: #d9e2ef;
  --accent: #2563eb;
  --accent-soft: #eaf1ff;
  --green: #15803d;
  --orange: #c2410c;
  --shadow: 0 18px 36px rgba(15, 23, 42, 0.09);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; width: 100%; }
body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
a { color: inherit; text-decoration: none; }
.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 18px;
}
.shell {
  width: min(980px, 100%);
}
.intro {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px;
  align-items: end;
  margin-bottom: 18px;
}
.eyebrow {
  margin: 0 0 7px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 900;
}
h1 {
  margin: 0;
  font-size: clamp(28px, 5vw, 44px);
  line-height: 1.15;
  letter-spacing: 0;
  word-break: keep-all;
}
.intro p {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.65;
  word-break: keep-all;
}
.mascot-hero {
  display: grid;
  grid-template-columns: auto minmax(130px, 170px);
  align-items: end;
  gap: 10px;
}
.mascot-bubble {
  position: relative;
  max-width: 190px;
  padding: 12px 13px;
  border: 1px solid #bfd4f5;
  border-radius: 8px;
  background: #fff;
  color: #334155;
  font-size: 13px;
  font-weight: 900;
  line-height: 1.45;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
}
.mascot-bubble::after {
  content: "";
  position: absolute;
  right: -7px;
  bottom: 18px;
  width: 12px;
  height: 12px;
  border-right: 1px solid #bfd4f5;
  border-bottom: 1px solid #bfd4f5;
  background: #fff;
  transform: rotate(-45deg);
}
.mascot-img {
  width: min(170px, 22vw);
  max-height: 180px;
  object-fit: contain;
  object-position: bottom center;
  filter: drop-shadow(0 14px 20px rgba(15, 23, 42, 0.18));
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.nav-card {
  display: flex;
  flex-direction: column;
  min-height: 260px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.nav-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 22px 40px rgba(15, 23, 42, 0.12);
}
.mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 900;
  font-size: 18px;
}
.nav-card:nth-child(2) .mark { background: #ecfdf3; color: var(--green); }
.nav-card:nth-child(3) .mark { background: #fff7ed; color: var(--orange); }
.nav-card h2 {
  margin: 22px 0 8px;
  font-size: 25px;
  line-height: 1.2;
}
.nav-card p {
  margin: 0;
  color: var(--muted);
  line-height: 1.6;
  word-break: keep-all;
}
.go {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 46px;
  margin-top: auto;
  border-radius: 8px;
  background: var(--text);
  color: #fff;
  font-weight: 900;
}
.nav-card:nth-child(1) .go { background: var(--accent); }
.nav-card:nth-child(2) .go { background: var(--green); }
.nav-card:nth-child(3) .go { background: var(--orange); }
@media (max-width: 820px) {
  .page { align-items: flex-start; padding: 22px 12px 34px; }
  .intro { grid-template-columns: 1fr; gap: 12px; }
  .mascot-hero { grid-template-columns: minmax(0, 1fr) 104px; align-items: center; }
  .mascot-bubble { max-width: none; }
  .mascot-img { width: 104px; max-height: 120px; }
  .grid { grid-template-columns: 1fr; }
  .nav-card { min-height: 210px; padding: 18px; }
  .nav-card h2 { font-size: 23px; }
}
</style>
</head>
<body>
<main class="page">
  <section class="shell" aria-label="학습 메뉴">
    <div class="intro">
      <div>
        <p class="eyebrow">조경산업기사 필기 학습</p>
        <h1>오늘은 어디부터 볼까요?</h1>
        <p>해설로 이해하고, 카드로 기억하고, 빈출 문제로 확인하는 흐름입니다.</p>
      </div>
      <div class="mascot-hero" aria-label="또로 학습 안내">
        <p class="mascot-bubble">또로가 오늘도 함정 냄새를 맡아볼게요.</p>
        <img class="mascot-img" src="./assets/ddoro-cutout.png" alt="또로 마스코트">
      </div>
    </div>

    <nav class="grid" aria-label="주요 학습 페이지">
      <a class="nav-card" href="./explanations.html">
        <span class="mark">01</span>
        <h2>기출 해설</h2>
        <p>문항별 정답 근거와 오답 이유를 차례대로 확인합니다.</p>
        <span class="go">기출 해설 보기</span>
      </a>

      <a class="nav-card" href="./study.html">
        <span class="mark">A</span>
        <h2>개념 공부</h2>
        <p>모바일에서 옆으로 넘기며 자주 나오는 개념을 가볍게 복습합니다.</p>
        <span class="go">개념 카드 보기</span>
      </a>

      <a class="nav-card" href="./quiz.html">
        <span class="mark">4</span>
        <h2>문제 풀기</h2>
        <p>반복 출제된 문제를 4지선다로 풀고 정답과 오답 해설을 바로 봅니다.</p>
        <span class="go">빈출 퀴즈 풀기</span>
      </a>
    </nav>
  </section>
</main>
</body>
</html>
